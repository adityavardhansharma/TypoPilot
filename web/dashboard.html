<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypoPilot — Training Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b09;
    --panel: #0c120e;
    --panel-edge: #16211a;
    --ink: #c9dccf;
    --ink-dim: #5d7263;
    --phosphor: #46e08a;
    --phosphor-soft: rgba(70, 224, 138, .12);
    --amber: #e0b346;
    --red: #e05a46;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --display: "Zilla Slab", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    overflow-x: hidden;
  }
  /* faint scanlines + vignette atmosphere */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 0%, transparent 55%, rgba(0,0,0,.5) 100%);
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  header {
    display: flex; align-items: baseline; gap: 18px;
    border-bottom: 1px solid var(--panel-edge); padding-bottom: 18px; margin-bottom: 26px;
  }
  header h1 {
    font-family: var(--display); font-size: 30px; font-weight: 700;
    color: var(--ink); letter-spacing: .5px;
  }
  header h1 em { color: var(--phosphor); font-style: normal; }
  .experiment { color: var(--ink-dim); font-size: 13px; }
  .status {
    margin-left: auto; padding: 5px 14px; border-radius: 3px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid var(--panel-edge); color: var(--ink-dim);
  }
  .status.training { color: var(--phosphor); border-color: var(--phosphor); animation: pulse 2.2s infinite; }
  .status.completed { color: var(--amber); border-color: var(--amber); }
  .status.failed, .status.stale { color: var(--red); border-color: var(--red); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* hero percentage */
  .hero { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 26px; margin-bottom: 26px; }
  .pct-panel {
    background: var(--panel); border: 1px solid var(--panel-edge);
    padding: 26px 30px; position: relative; overflow: hidden;
  }
  .pct-panel::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, var(--phosphor-soft), transparent 60%);
    pointer-events: none;
  }
  .pct {
    font-size: clamp(64px, 9vw, 108px); font-weight: 600; line-height: 1;
    color: var(--phosphor); text-shadow: 0 0 24px rgba(70,224,138,.35);
    font-variant-numeric: tabular-nums;
  }
  .pct small { font-size: .35em; color: var(--ink-dim); }
  .bar {
    margin-top: 20px; height: 10px; background: #111a14;
    border: 1px solid var(--panel-edge); position: relative;
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #1d7a4b, var(--phosphor));
    box-shadow: 0 0 12px rgba(70,224,138,.5);
    transition: width .6s ease;
  }
  .under-bar { margin-top: 12px; display: flex; justify-content: space-between; color: var(--ink-dim); font-size: 12px; }

  /* stat grid */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--panel-edge); border: 1px solid var(--panel-edge); }
  .stat { background: var(--panel); padding: 16px 18px; }
  .stat b { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; font-weight: 500; }
  .stat span { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .accent { color: var(--phosphor); }
  .stat .amber { color: var(--amber); }

  /* chart + log */
  .panels { display: grid; grid-template-columns: 3fr 2fr; gap: 26px; margin-top: 26px; }
  @media (max-width: 900px) { .panels, .hero { grid-template-columns: 1fr; } }
  section {
    background: var(--panel); border: 1px solid var(--panel-edge); padding: 18px;
  }
  section h2 {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 500; margin-bottom: 14px;
    display: flex; gap: 12px; align-items: center;
  }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--panel-edge); }
  canvas { width: 100%; height: 260px; display: block; }
  .legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--ink-dim); }
  .key { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }

  .log {
    height: 276px; overflow-y: auto; font-size: 12.5px; line-height: 1.75;
    color: var(--ink); scrollbar-width: thin; scrollbar-color: var(--panel-edge) transparent;
  }
  .log div { white-space: pre-wrap; }
  .log .eval { color: var(--amber); }
  .log .ckpt { color: var(--phosphor); }
  .log .fail { color: var(--red); }

  .footer-note { margin-top: 26px; color: var(--ink-dim); font-size: 12px; }
  .footer-note code { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Typo<em>Pilot</em> // training console</h1>
    <span class="experiment" id="experiment">—</span>
    <span class="status" id="status">connecting</span>
  </header>

  <div class="hero">
    <div class="pct-panel">
      <div class="pct"><span id="pct">0.00</span><small> %</small></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="under-bar">
        <span id="stepline">step 0 / 0</span>
        <span id="epochline">epoch 0 / 0</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>Train loss</b><span class="accent" id="loss">—</span></div>
      <div class="stat"><b>Eval loss</b><span class="amber" id="eval_loss">—</span></div>
      <div class="stat"><b>ETA</b><span id="eta">—</span></div>
      <div class="stat"><b>Elapsed</b><span id="elapsed">—</span></div>
      <div class="stat"><b>Steps / sec</b><span id="sps">—</span></div>
      <div class="stat"><b>Learning rate</b><span id="lr">—</span></div>
      <div class="stat"><b>Peak VRAM</b><span id="vram">—</span></div>
      <div class="stat"><b>Last update</b><span id="updated">—</span></div>
    </div>
  </div>

  <div class="panels">
    <section>
      <h2>Loss</h2>
      <canvas id="chart" width="640" height="260"></canvas>
      <div class="legend">
        <span><i class="key" style="background:var(--phosphor)"></i>train</span>
        <span><i class="key" style="background:var(--amber)"></i>eval</span>
      </div>
    </section>
    <section>
      <h2>Live log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <p class="footer-note">
    polling <code id="src">progress.json</code> every 2s — refresh-free; leave this tab open while the run cooks.
  </p>
</div>

<script>
const params = new URLSearchParams(location.search);
const run = params.get("run") || "byt5-small-pilot-001";
const SRC = `/experiments/${run}/progress.json`;
document.getElementById("src").textContent = SRC;

const $ = id => document.getElementById(id);

function fmtDuration(s) {
  if (s == null) return "—";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${String(m).padStart(2,"0")}m` : m ? `${m}m ${String(sec).padStart(2,"0")}s` : `${sec}s`;
}

function drawChart(train, evals) {
  const canvas = $("chart");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!train.length) return;

  const pad = { l: 46, r: 10, t: 10, b: 22 };
  const xs = train.map(p => p[0]).concat(evals.map(p => p[0]));
  const ys = train.map(p => p[1]).concat(evals.map(p => p[1]));
  const xMax = Math.max(...xs), xMin = 0;
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  if (yMax === yMin) { yMax += 0.1; yMin -= 0.1; }
  const yPad = (yMax - yMin) * 0.08; yMin -= yPad; yMax += yPad;

  const X = x => pad.l + (x - xMin) / (xMax - xMin || 1) * (w - pad.l - pad.r);
  const Y = y => h - pad.b - (y - yMin) / (yMax - yMin) * (h - pad.t - pad.b);

  ctx.strokeStyle = "#16211a"; ctx.fillStyle = "#5d7263";
  ctx.font = "10px IBM Plex Mono, monospace"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const yVal = yMin + (yMax - yMin) * g / 4, y = Y(yVal);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(yVal.toFixed(2), 6, y + 3);
  }
  ctx.fillText("0", pad.l, h - 8);
  ctx.fillText(String(xMax), w - pad.r - 30, h - 8);

  function line(points, color, glow) {
    if (!points.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.8;
    ctx.shadowColor = glow; ctx.shadowBlur = 6;
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  line(train, "#46e08a", "rgba(70,224,138,.6)");
  line(evals, "#e0b346", "rgba(224,179,70,.6)");
  evals.forEach(p => {
    ctx.fillStyle = "#e0b346";
    ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 3, 0, Math.PI * 2); ctx.fill();
  });
}

let lastLogLength = -1;
async function poll() {
  try {
    const res = await fetch(SRC + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();

    $("experiment").textContent = s.experiment || run;
    $("pct").textContent = (s.percent ?? 0).toFixed(2);
    $("bar").style.width = (s.percent ?? 0) + "%";
    $("stepline").textContent = `step ${s.global_step} / ${s.max_steps}`;
    $("epochline").textContent = `epoch ${s.epoch} / ${s.num_epochs}`;
    $("loss").textContent = s.loss != null ? s.loss.toFixed(4) : "—";
    $("eval_loss").textContent = s.eval_loss != null ? s.eval_loss.toFixed(4) : "—";
    $("eta").textContent = fmtDuration(s.eta_seconds);
    $("elapsed").textContent = fmtDuration(s.elapsed_seconds);
    $("sps").textContent = s.steps_per_second != null ? s.steps_per_second.toFixed(2) : "—";
    $("lr").textContent = s.learning_rate != null ? s.learning_rate.toExponential(1) : "—";
    $("vram").textContent = s.peak_vram_gb != null ? s.peak_vram_gb + " GB" : "—";

    const age = s.updated_at ? (Date.now() / 1000 - s.updated_at) : null;
    $("updated").textContent = age != null ? Math.round(age) + "s ago" : "—";

    const el = $("status");
    let status = s.status || "unknown";
    if (status === "training" && age != null && age > 300) status = "stale";
    el.textContent = status; el.className = "status " + status;

    drawChart(s.loss_history || [], s.eval_history || []);

    const lines = s.log_lines || [];
    if (lines.length !== lastLogLength) {
      lastLogLength = lines.length;
      const log = $("log");
      log.innerHTML = lines.map(l => {
        const cls = l.includes("eval") ? "eval" : l.includes("checkpoint") ? "ckpt"
                  : l.includes("failed") ? "fail" : "";
        return `<div class="${cls}"></div>`;
      }).join("");
      [...log.children].forEach((d, i) => d.textContent = lines[i]);
      log.scrollTop = log.scrollHeight;
    }
  } catch (e) {
    $("status").textContent = "waiting for run";
    $("status").className = "status";
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
