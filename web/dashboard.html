<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypoPilot — Training Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b09; --panel: #0c120e; --panel-2: #0f1712; --panel-edge: #16211a;
    --ink: #c9dccf; --ink-dim: #5d7263;
    --phosphor: #46e08a; --phosphor-soft: rgba(70,224,138,.12);
    --amber: #e0b346; --red: #e05a46; --blue: #5aa9e0;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --display: "Zilla Slab", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 14px; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% -10%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 24px 60px; }

  header { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--panel-edge); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  header h1 { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: .5px; }
  header h1 em { color: var(--phosphor); font-style: normal; }
  .experiment { color: var(--ink-dim); font-size: 13px; }
  .status { margin-left: auto; padding: 5px 15px; border-radius: 3px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--panel-edge); color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.training { color: var(--phosphor); border-color: rgba(70,224,138,.4); }
  .status.training::before { animation: pulse 1.4s infinite; }
  .status.completed { color: var(--amber); border-color: rgba(224,179,70,.4); }
  .status.failed, .status.stale { color: var(--red); border-color: rgba(224,90,70,.4); }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; } 50% { opacity: .4; } }

  /* hero: progress ring + stat grid */
  .hero { display: grid; grid-template-columns: 260px 1fr; gap: 22px; margin-bottom: 22px; align-items: stretch; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
  .ring-card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .ring-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, var(--phosphor-soft), transparent 65%); pointer-events: none; }
  .ring-wrap { position: relative; width: 190px; height: 190px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-pct { font-size: 46px; font-weight: 600; color: var(--phosphor); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(70,224,138,.35); }
  .ring-pct small { font-size: .4em; color: var(--ink-dim); }
  .ring-sub { margin-top: 6px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .ring-eta { margin-top: 12px; font-size: 12px; color: var(--ink); }
  .ring-eta b { color: var(--amber); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--panel-edge); border: 1px solid var(--panel-edge); border-radius: 4px; overflow: hidden; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--panel); padding: 14px 16px; transition: background .2s; }
  .stat:hover { background: var(--panel-2); }
  .stat b { display: block; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 7px; font-weight: 500; }
  .stat span { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .delta { font-size: 12px; margin-left: 6px; font-weight: 500; }
  .stat .down { color: var(--phosphor); } .stat .up { color: var(--red); }
  .accent { color: var(--phosphor); } .amberc { color: var(--amber); }

  /* chart + log */
  .panels { display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px; padding: 16px 18px; }
  section h2 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); font-weight: 500; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
  section h2 .legend-in { display: inline-flex; gap: 14px; margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 11.5px; }
  .key { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
  .chart-wrap { position: relative; }
  canvas { width: 100%; height: 300px; display: block; cursor: crosshair; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(7,11,9,.96); border: 1px solid var(--panel-edge); border-radius: 4px; padding: 8px 11px; font-size: 12px; line-height: 1.6; z-index: 5; opacity: 0; transition: opacity .1s; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .tooltip .t-step { color: var(--ink-dim); margin-bottom: 3px; }
  .tooltip .t-row { display: flex; gap: 10px; justify-content: space-between; }
  .tooltip .t-row b { font-weight: 600; }

  .log { height: 318px; overflow-y: auto; font-size: 12.5px; line-height: 1.7; scrollbar-width: thin; scrollbar-color: var(--panel-edge) transparent; }
  .log div { white-space: pre-wrap; padding: 1px 0; }
  .log .eval { color: var(--amber); } .log .ckpt { color: var(--phosphor); } .log .fail { color: var(--red); }

  .footer-note { margin-top: 22px; color: var(--ink-dim); font-size: 12px; }
  .footer-note code { color: var(--ink); }

  /* clickable loss tiles + history ticker modal */
  .stat.clickable { cursor: pointer; position: relative; }
  .stat.clickable:focus-visible { outline: 2px solid var(--phosphor); outline-offset: -2px; }
  .stat.clickable::after { content: "⤢ history"; position: absolute; top: 12px; right: 14px; font-size: 9px; letter-spacing: .5px; color: var(--ink-dim); opacity: 0; transition: opacity .2s; }
  .stat.clickable:hover::after { opacity: .7; }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(3,6,4,.72); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal.open { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; width: 100%; max-width: 560px; max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--panel-edge); }
  .modal-head h3 { font-family: var(--display); font-size: 18px; font-weight: 700; }
  .modal-head .msum { margin-left: auto; font-size: 12px; color: var(--ink-dim); }
  .modal-head .msum .g { color: var(--phosphor); } .modal-head .msum .r { color: var(--red); }
  .modal-close { background: none; border: 1px solid var(--panel-edge); color: var(--ink-dim); width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .modal-close:hover { color: var(--ink); border-color: var(--ink-dim); }
  .ticker { overflow-y: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--panel-edge) transparent; }
  .tk-header { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 84px 74px 1fr 96px; gap: 10px; padding: 7px 20px; background: rgba(12,18,14,.97); border-bottom: 1px solid var(--panel-edge); color: var(--ink-dim); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
  .tk-row { display: grid; grid-template-columns: 84px 74px 1fr 96px; align-items: center; gap: 10px; padding: 5px 20px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tk-row:hover { background: var(--panel-2); }
  .tk-step { color: var(--ink-dim); }
  .tk-val { font-weight: 600; }
  .tk-bar { height: 8px; background: #111a14; border-radius: 2px; overflow: hidden; position: relative; }
  .tk-fill { position: absolute; top: 0; bottom: 0; left: 50%; }
  .tk-fill.down { background: linear-gradient(90deg, var(--phosphor), rgba(70,224,138,.4)); transform: translateX(-100%); }
  .tk-fill.up { background: linear-gradient(90deg, rgba(224,90,70,.4), var(--red)); }
  .tk-delta { text-align: right; font-weight: 600; }
  .tk-delta.down { color: var(--phosphor); } .tk-delta.up { color: var(--red); } .tk-delta.flat { color: var(--ink-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Typo<em>Pilot</em> // training console</h1>
    <span class="experiment" id="experiment">—</span>
    <span class="status" id="status">connecting</span>
  </header>

  <div class="hero">
    <div class="ring-card">
      <div class="ring-wrap">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="84" fill="none" stroke="#111a14" stroke-width="12"/>
          <circle id="ring" cx="95" cy="95" r="84" fill="none" stroke="url(#grad)" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="527.8" stroke-dashoffset="527.8"
                  style="transition: stroke-dashoffset .6s ease; filter: drop-shadow(0 0 6px rgba(70,224,138,.5));"/>
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d7a4b"/><stop offset="1" stop-color="#46e08a"/>
          </linearGradient></defs>
        </svg>
        <div class="ring-center">
          <div class="ring-pct"><span id="pct">0.0</span><small>%</small></div>
          <div class="ring-sub" id="stepline">step 0 / 0</div>
        </div>
      </div>
      <div class="ring-eta">ETA <b id="eta">—</b> · <span id="epochline">epoch 0 / 0</span></div>
    </div>

    <div class="stats">
      <div class="stat clickable" data-history="train" role="button" tabindex="0" aria-label="Open full training loss history"><b>Train loss</b><span class="accent" id="loss">—</span><span class="delta" id="loss-d"></span></div>
      <div class="stat clickable" data-history="eval" role="button" tabindex="0" aria-label="Open full evaluation loss history"><b>Eval loss</b><span class="amberc" id="eval_loss">—</span><span class="delta" id="eval-d"></span></div>
      <div class="stat"><b>Best eval</b><span id="best_eval">—</span></div>
      <div class="stat"><b>Steps / sec</b><span id="sps">—</span></div>
      <div class="stat"><b>Elapsed</b><span id="elapsed">—</span></div>
      <div class="stat"><b>Learning rate</b><span id="lr">—</span></div>
      <div class="stat"><b>Peak VRAM</b><span id="vram">—</span></div>
      <div class="stat"><b>Last update</b><span id="updated">—</span></div>
    </div>
  </div>

  <div class="panels">
    <section>
      <h2>Loss
        <span class="legend-in">
          <span><i class="key" style="background:var(--phosphor)"></i>train</span>
          <span><i class="key" style="background:var(--amber)"></i>eval</span>
        </span>
      </h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </section>
    <section>
      <h2>Live log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <p class="footer-note">polling <code id="src">progress.json</code> every 2s · hover the chart for exact values</p>
</div>

<div class="modal" id="history-modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="history-title">Loss history</h3>
      <div class="msum" id="history-summary"></div>
      <button class="modal-close" id="history-close" type="button" aria-label="Close history">×</button>
    </div>
    <div class="ticker" id="history-ticker"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const run = params.get("run") || "byt5-small-pilot-001";
const SRC = `/experiments/${run}/progress.json`;
document.getElementById("src").textContent = SRC;
const $ = id => document.getElementById(id);

function fmtDur(s) {
  if (s == null) return "—";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}h ${String(m).padStart(2,"0")}m` : m ? `${m}m ${String(sec).padStart(2,"0")}s` : `${sec}s`;
}
function smooth(points, win) {
  if (points.length < 3) return points.slice();
  const out = [];
  for (let i = 0; i < points.length; i++) {
    const a = Math.max(0, i - win), b = Math.min(points.length - 1, i + win);
    let s = 0; for (let j = a; j <= b; j++) s += points[j][1];
    out.push([points[i][0], s / (b - a + 1)]);
  }
  return out;
}

// ---- interactive chart ----
const canvas = $("chart"), tip = $("tooltip");
let CH = { train: [], evals: [], map: null, hover: null };

function renderChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const train = CH.train, evals = CH.evals;
  if (!train.length) { CH.map = null; return; }

  const pad = { l: 50, r: 12, t: 12, b: 26 };
  const xs = train.map(p => p[0]).concat(evals.map(p => p[0]));
  const ys = train.map(p => p[1]).concat(evals.map(p => p[1]));
  const xMax = Math.max(...xs, 1), xMin = 0;
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  if (yMax === yMin) { yMax += 0.1; yMin -= 0.1; }
  const yPad = (yMax - yMin) * 0.1; yMin = Math.max(0, yMin - yPad); yMax += yPad;
  const X = x => pad.l + (x - xMin) / (xMax - xMin || 1) * (w - pad.l - pad.r);
  const Y = y => h - pad.b - (y - yMin) / (yMax - yMin) * (h - pad.t - pad.b);
  CH.map = { X, Y, xMin, xMax, yMin, yMax, pad, w, h };

  // gridlines + y labels
  ctx.strokeStyle = "#16211a"; ctx.fillStyle = "#5d7263";
  ctx.font = "10px IBM Plex Mono, monospace"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const yVal = yMin + (yMax - yMin) * g / 4, y = Y(yVal);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(yVal.toFixed(3), 6, y + 3);
  }
  ctx.fillText("0", pad.l, h - 9);
  ctx.fillText(xMax.toLocaleString(), w - pad.r - 42, h - 9);

  // area fill under smoothed train
  const strain = smooth(train, 4);
  ctx.beginPath();
  strain.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
  ctx.lineTo(X(strain[strain.length-1][0]), Y(yMin));
  ctx.lineTo(X(strain[0][0]), Y(yMin)); ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
  grad.addColorStop(0, "rgba(70,224,138,.16)"); grad.addColorStop(1, "rgba(70,224,138,0)");
  ctx.fillStyle = grad; ctx.fill();

  // raw train (faint) + smoothed train (bright)
  function line(points, color, width, glow, alpha) {
    if (points.length < 2) return;
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.shadowColor = glow || "transparent"; ctx.shadowBlur = glow ? 6 : 0;
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
    ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  line(train, "#46e08a", 1, null, .22);
  line(strain, "#46e08a", 1.9, "rgba(70,224,138,.55)");
  line(evals, "#e0b346", 1.9, "rgba(224,179,70,.5)");
  evals.forEach(p => { ctx.fillStyle = "#e0b346"; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 3, 0, 7); ctx.fill(); });

  // hover crosshair + markers
  if (CH.hover != null) {
    const hx = X(CH.hover.step);
    ctx.strokeStyle = "rgba(201,220,207,.25)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, h - pad.b); ctx.stroke();
    if (CH.hover.train != null) { ctx.fillStyle = "#46e08a"; ctx.beginPath(); ctx.arc(hx, Y(CH.hover.train), 4, 0, 7); ctx.fill(); }
    if (CH.hover.evalv != null) { ctx.fillStyle = "#e0b346"; ctx.beginPath(); ctx.arc(hx, Y(CH.hover.evalv), 4.5, 0, 7); ctx.fill(); }
  }
}

function nearest(points, step) {
  if (!points.length) return null;
  let best = points[0];
  for (const p of points) if (Math.abs(p[0] - step) < Math.abs(best[0] - step)) best = p;
  return best;
}
canvas.addEventListener("mousemove", e => {
  if (!CH.map) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const { X, xMin, xMax, pad, w } = CH.map;
  const frac = (mx - pad.l) / (w - pad.l - pad.r);
  const step = xMin + frac * (xMax - xMin);
  const t = nearest(CH.train, step), ev = nearest(CH.evals, step);
  const anchor = t || ev; if (!anchor) return;
  CH.hover = { step: anchor[0], train: t ? t[1] : null, evalv: ev ? ev[1] : null };
  renderChart();
  tip.style.opacity = 1;
  tip.innerHTML = `<div class="t-step">step ${anchor[0].toLocaleString()}</div>`
    + (t ? `<div class="t-row"><span style="color:var(--phosphor)">train</span><b>${t[1].toFixed(4)}</b></div>` : "")
    + (ev ? `<div class="t-row"><span style="color:var(--amber)">eval</span><b>${ev[1].toFixed(4)}</b></div>` : "");
  const tw = tip.offsetWidth, px = X(anchor[0]);
  tip.style.left = Math.min(w - tw - 6, Math.max(6, px + 12)) + "px";
  tip.style.top = "14px";
});
canvas.addEventListener("mouseleave", () => { CH.hover = null; tip.style.opacity = 0; renderChart(); });
window.addEventListener("resize", renderChart);

let lastLogLen = -1, prevLoss = null, prevEval = null;
function setDelta(el, cur, prev) {
  if (prev == null || cur == null) { el.textContent = ""; return; }
  const d = cur - prev;
  if (Math.abs(d) < 1e-6) { el.textContent = ""; return; }
  el.textContent = (d < 0 ? "▼" : "▲") + Math.abs(d).toFixed(3);
  el.className = "delta " + (d < 0 ? "down" : "up");
}

// ---- full loss-history ticker ----
const historyModal = $("history-modal"), historyTicker = $("history-ticker");
let latestState = null, activeHistory = null, historyReturnFocus = null;

function historyValue(v) {
  if (v == null || !Number.isFinite(v)) return "—";
  return v >= .001 ? v.toFixed(5) : v.toExponential(3);
}

function renderHistory(kind) {
  if (!latestState) return;
  const isTrain = kind === "train";
  const points = (isTrain ? latestState.loss_history : latestState.eval_history) || [];
  $("history-title").textContent = isTrain ? "Training loss history" : "Evaluation loss history";
  if (!points.length) {
    $("history-summary").textContent = "no readings yet";
    historyTicker.innerHTML = `<div class="tk-row"><span class="tk-step">waiting</span><span class="tk-val">—</span></div>`;
    return;
  }

  let improved = 0, regressed = 0, flat = 0, maxDelta = 0;
  const deltas = points.map((p, i) => {
    if (!i) return null;
    const d = p[1] - points[i - 1][1];
    maxDelta = Math.max(maxDelta, Math.abs(d));
    if (d < -1e-9) improved++; else if (d > 1e-9) regressed++; else flat++;
    return d;
  });
  const vals = points.map(p => p[1]);
  const best = Math.min(...vals), latest = vals[vals.length - 1];
  $("history-summary").innerHTML = `<span class="g">${improved}▼</span> · <span class="r">${regressed}▲</span> · best ${historyValue(best)} · latest ${historyValue(latest)}`;

  const rows = points.map((p, i) => {
    const d = deltas[i];
    const cls = d == null || Math.abs(d) < 1e-9 ? "flat" : d < 0 ? "down" : "up";
    const arrow = d == null ? "start" : d < 0 ? "▼" : d > 0 ? "▲" : "—";
    const deltaText = d == null ? "baseline" : `${arrow} ${Math.abs(d).toFixed(5)}`;
    const width = d == null || !maxDelta ? 0 : Math.max(2, Math.abs(d) / maxDelta * 50);
    return `<div class="tk-row">
      <span class="tk-step">step ${Number(p[0]).toLocaleString()}</span>
      <span class="tk-val">${historyValue(p[1])}</span>
      <span class="tk-bar" title="change from previous reading"><i class="tk-fill ${cls}" style="width:${width}%"></i></span>
      <span class="tk-delta ${cls}">${deltaText}</span>
    </div>`;
  }).reverse().join("");
  historyTicker.innerHTML = `<div class="tk-header"><span>step</span><span>loss</span><span>movement</span><span style="text-align:right">change</span></div>${rows}`;
}

function openHistory(kind, trigger) {
  activeHistory = kind;
  historyReturnFocus = trigger || document.activeElement;
  renderHistory(kind);
  historyModal.classList.add("open");
  $("history-close").focus();
}
function closeHistory() {
  historyModal.classList.remove("open");
  activeHistory = null;
  if (historyReturnFocus) historyReturnFocus.focus();
}
document.querySelectorAll("[data-history]").forEach(tile => {
  tile.addEventListener("click", () => openHistory(tile.dataset.history, tile));
  tile.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openHistory(tile.dataset.history, tile); }
  });
});
$("history-close").addEventListener("click", closeHistory);
historyModal.addEventListener("click", e => { if (e.target === historyModal) closeHistory(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && historyModal.classList.contains("open")) closeHistory(); });

async function poll() {
  try {
    const res = await fetch(SRC + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();
    latestState = s;

    $("experiment").textContent = s.experiment || run;
    const pct = s.percent ?? 0;
    $("pct").textContent = pct.toFixed(1);
    $("ring").style.strokeDashoffset = (527.8 * (1 - pct / 100)).toFixed(1);
    $("stepline").textContent = `step ${(s.global_step||0).toLocaleString()} / ${(s.max_steps||0).toLocaleString()}`;
    $("epochline").textContent = `epoch ${s.epoch ?? 0} / ${s.num_epochs ?? 0}`;
    $("eta").textContent = fmtDur(s.eta_seconds);

    setDelta($("loss-d"), s.loss, prevLoss); prevLoss = s.loss;
    setDelta($("eval-d"), s.eval_loss, prevEval); prevEval = s.eval_loss;
    $("loss").textContent = s.loss != null ? s.loss.toFixed(4) : "—";
    $("eval_loss").textContent = s.eval_loss != null ? s.eval_loss.toFixed(4) : "—";
    const evs = s.eval_history || [];
    $("best_eval").textContent = evs.length ? Math.min(...evs.map(e => e[1])).toFixed(4) : "—";
    $("sps").textContent = s.steps_per_second != null ? s.steps_per_second.toFixed(2) : "—";
    $("elapsed").textContent = fmtDur(s.elapsed_seconds);
    $("lr").textContent = s.learning_rate != null ? s.learning_rate.toExponential(1) : "—";
    $("vram").textContent = s.peak_vram_gb != null ? s.peak_vram_gb + " GB" : "—";
    const age = s.updated_at ? (Date.now()/1000 - s.updated_at) : null;
    $("updated").textContent = age != null ? Math.round(age) + "s ago" : "—";

    const el = $("status");
    let st = s.status || "unknown";
    if (st === "training" && age != null && age > 300) st = "stale";
    el.textContent = st; el.className = "status " + st;

    CH.train = s.loss_history || []; CH.evals = s.eval_history || [];
    if (CH.hover == null) renderChart();
    if (activeHistory) renderHistory(activeHistory);

    const lines = s.log_lines || [];
    if (lines.length !== lastLogLen) {
      lastLogLen = lines.length;
      const log = $("log");
      log.innerHTML = lines.map(l => {
        const c = l.includes("eval") ? "eval" : l.includes("checkpoint") ? "ckpt" : l.includes("failed") ? "fail" : "";
        return `<div class="${c}"></div>`;
      }).join("");
      [...log.children].forEach((d, i) => d.textContent = lines[i]);
      log.scrollTop = log.scrollHeight;
    }
  } catch (e) {
    $("status").textContent = "waiting for run"; $("status").className = "status";
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
